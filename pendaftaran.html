<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Peserta</title>
</head>

    <style>
        body { font-family: Arial; background: #f4f8ff; argin: 20px; }
        h1 { color: #2059ad; text-align: center; margin-bottom: 25px; }
        .form-box { background-color: white; border: 1px solid #d0dbe8; padding: 15px; margin-bottom: 30px; }
        .form-group { margin-bottom: 10px; }
        input[type="text"], select { padding: 6px; border: 1px solid #bfcbd9; border-radius: 3px; }
        button { background-color: #2059ad; color: white; padding: 7px 14px; border: none;  cursor: pointer; }
        .judul-tabel { font-size: 20px; text-align: center; color: #2059ad; margin-top: 30px; margin-bottom: 20px; }
        table { border-collapse: collapse; width: 100%; background-color: white; font-size: 14px; }
        th { background-color: #2059ad; color: white; padding: 7px; border: 1px solid #d0dbe8; text-align: center; }
        td { border: 1px solid #d0dbe8; padding: 7px; }
        tbody tr:nth-child(even) { background-color: #e5eefb; }
    </style>
<body>

    <!---
    Tugas Pertemuan 3
    nim: 252520102
    nama lengkap: MEILA_BUNGA_HENDRAWAN
    kelas: TI_A
    -->


    <h1>Pendaftaran Peserta</h1>
     <div class="form-box">
        <form>
            <div class="form-group">
                <label>Nama:</label><br>
                <input type="text" name="nama" required>
            </div>

            <div class="form-group">
                Jenis Kelamin:
                <input type="radio" name="jk" value="L" required> Laki-laki
                <input type="radio" name="jk" value="P"> Perempuan
            </div>

            <div class="form-group">
                <label>Jurusan:</label><br>
                <select name="jurusan">
                    <option>Informatika</option>
                    <option>Sistem Informasi</option>

                </select>
            </div>
            <button type="submit">Kirim</button>
        </form>
    </div>

    <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Jurusan</th>
                </tr>
            </thead>

            <tbody>
            <tr>
                <td>1</td>
                <td>Budi Santoso</td>
                <td>Informatika</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Sari Wulandari</td>
                <td>Sistem Informasi</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
